# `docker compose up` brings up db, backend and frontend. Ollama sits behind a
# profile so it cannot fight the host's install for port 11434 - embedding
# needs the GPU, and the GPU is on the host.
#
# This does NOT populate the database: a clean volume comes up with an empty
# schema, and ingest is a documented host-side step. See README.md.

services:
  db:
    image: pgvector/pgvector:pg16
    # Docker defaults /dev/shm to 64MB, and the parallel HNSW build coordinates
    # workers through it: too little fails with "No space left on device",
    # which is /dev/shm filling rather than the disk. A limit, not a reservation.
    shm_size: 4gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam}
      POSTGRES_DB: ${POSTGRES_DB:-steamvibe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steam} -d ${POSTGRES_DB:-steamvibe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Host is `db`, not 127.0.0.1, which inside a container is the container.
      # Hence set here rather than inherited from .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steamvibe}
      # The host's Ollama, for the GPU. With `--profile ollama` running instead,
      # override this to http://ollama:11434.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-snowflake-arctic-embed2}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:9b}
      CHAT_THINK: ${CHAT_THINK:-false}
      CHAT_NUM_CTX: ${CHAT_NUM_CTX:-8192}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-10}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # config.py defaults to `rerank`, which this container CANNOT do: no torch
      # in the image, no GPU reachable from it. Left at the default it would
      # warn on every search; overridden here rather than papered over.
      RANK_METHOD: ${RANK_METHOD:-rrf}
    # Docker Desktop resolves host.docker.internal on its own; native Linux
    # does not, and this is what makes the same file work on both.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time. The browser runs on the host, so
        # it uses the published port, not the compose network.
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    depends_on:
      - backend
    # Host port 5173 on purpose: it is what the API's CORS allowlist already
    # names, so containerising the frontend needs no backend code change.
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Uncomment for GPU inside the container. Requires the NVIDIA Container
    # Toolkit; without it Ollama runs on CPU and embedding 130k games is slow.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama:
