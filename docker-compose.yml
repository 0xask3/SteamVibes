# Weekend 1 uses only `db`. The `ollama` service exists so that a clean
# machine can run the whole stack with one command (Weekend 3 goal).
# During development Ollama runs natively on the host for GPU access —
# see .env.example. Do not start both; they both want port 11434.

services:
  db:
    image: pgvector/pgvector:pg16
    # Docker defaults /dev/shm to 64MB. Postgres coordinates parallel workers
    # through shared memory, so building the HNSW index with
    # maintenance_work_mem=2GB fails with "No space left on device" — which is
    # /dev/shm filling, not the disk. This is a limit, not a reservation.
    shm_size: 4gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam}
      POSTGRES_DB: ${POSTGRES_DB:-steamvibe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steam} -d ${POSTGRES_DB:-steamvibe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Uncomment for GPU inside the container. Requires the NVIDIA Container
    # Toolkit; without it Ollama runs on CPU and embedding 120k games is slow.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama:
