server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: anything that is not a real file falls back to
    # index.html rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these names, so a stale cache cannot serve the wrong
    # content. index.html is excluded: it points at the fingerprinted ones.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
