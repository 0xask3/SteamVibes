# The SAME 118 targets as queries.yaml, asked in German. Run with
# `uv run python -m eval.run_eval --queries eval/queries_de.yaml`.
#
# GENERATED from queries.yaml by holding `expect`, `tier` and `from` fixed and
# replacing only the query text. app_ids were copied, never retyped - 148 of
# them transcribed by hand would produce a typo, and a typo here looks exactly
# like a recall failure.
#
# WHY A SEPARATE FILE. Recall is comparable across configs on a FIXED set and
# never across sets, so adding these to queries.yaml would invalidate every
# published number. That file stays frozen at 118; this is measured beside it.
#
# WHY THE SAME TARGETS. run_eval's aggregate EN/DE rows were never a language
# measurement - German was 37% core against English's 22%, so part of the gap
# was tier mix. Holding targets and tiers fixed leaves language as the only
# variable.
#
# WHAT IT IS NOT. German renderings of a fixed set of requests, not queries
# collected from German players: this measures the PENALTY FOR ASKING IN
# GERMAN, not how Germans search. Genre loanwords stay English (Roguelike,
# Metroidvania, Souls-like, Deckbuilder) because that is how German gaming
# discourse writes them, and translating them would measure a vocabulary
# nobody uses.
#
# The 27 rows that were already German in queries.yaml carry over verbatim, so
# for those the two files agree and the EN/DE comparison uses the other 91.

