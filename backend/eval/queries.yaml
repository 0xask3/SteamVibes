# --------------------------------------------------- specific description ----
# `tier: specific` marks long descriptive queries with exactly ONE right answer.
# `core` above is the opposite: short genre labels ("city builder") whose ground
# truth names 2-3 famous games out of hundreds that would satisfy the query, so
# core recall understates quality - a correct but unlisted answer scores zero.
# The two tiers are NOT comparable to each other. Compare a tier against itself
# across configs.
#
# THIS TIER IS NOT THE LONG TAIL, which is what it was built for. It was meant
# to hold games a popularity weight would delete, sampled at 50-5,000 reviews.
# It does not: every target below lands in the 93rd-98th percentile of the
# corpus by review count, median 97.1. Two mistakes, both mine:
#
#   1. sample_longtail.sql used DISTINCT ON (tags[1]) ORDER BY total_reviews
#      DESC, which returns the MOST-reviewed game per tag within the band - the
#      top edge of the tail rather than the tail. I then picked the ones I
#      recognised, biasing it further up.
#   2. The queries were written while reading each game's short_description,
#      which is part of embed_text. A near-paraphrase puts the target at cosine
#      rank ~1, where the popularity term is arithmetically too small to shift
#      it, so this tier reports "no harm" by construction.
#
# Measured: recall here RISES with the popularity weight (54.5% -> 68.2% between
# w=0.2 and w=1.0) while the median returned result climbs from 165 reviews to
# 4,021. The tier cannot see the cost of the thing it was built to police. The
# tail-cost counter-metric in run_eval.py answers that instead, because it needs
# no labels and no query authorship. This tier still answers a real question:
# whether a detailed description finds the one game it describes.
#
# WRITTEN TARGET-FIRST - each game was sampled first and the query written
# afterwards without looking at what search returns. That removed the bias in
# query selection and did nothing about the bias in target selection. See
# failures.md #26.

- query: browsing a fake 1990s internet and reporting what you find
