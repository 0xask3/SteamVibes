# ---------------------------------------------------------------- German ----
# Same corpus, English descriptions. These measure the embedding model, not the
# data. Compound nouns are the thing to watch: Aufbauspiel, Koop-Modus,
# Städtebau and Rätselspiel are single semantic units that an English-tuned
# tokenizer shreds. See BUILD_PLAN, Weekend 3.

- query: gemütliches Aufbauspiel für zwei
  lang: de
  from: "failures.md #9 - social constraints"
  expect: [892970, 1169040]           # Valheim, Necesse

- query: entspanntes Spiel zum Abschalten
  lang: de
