# Labelled queries for recall@10. Run with `uv run python -m eval.run_eval`.
#
# `expect` lists app_ids that MUST appear in the top 10. This is deliberately
# NOT complete ground truth - there is no way to label 130,651 games - it is a
# set of results confident enough that missing one is a real failure.
#
# Every app_id was verified present, embedded, and above the review threshold
# before being written here. A typo would look exactly like a recall failure.
#
# `lang` splits the results table, because the whole point of Weekend 3 is
# measuring how far German degrades against an English-centric embedding model.
# Ten German queries, per BUILD_PLAN's "at least 8".
#
# Several queries come straight from failures.md, marked with `from`. Those are
# the ones that were observed to break, so a config change that fixes the
# average while regressing them is not an improvement.

- query: cozy farming sim with fishing
  lang: en
  expect: [413150, 666140, 1158160]   # Stardew Valley, My Time at Portia, Coral Island

- query: co-op survival crafting with base building
  lang: en
  expect: [892970, 1169040, 105600]   # Valheim, Necesse, Terraria

- query: extremely difficult souls-like
  lang: en
  expect: [367520, 774361, 283640]    # Hollow Knight, Blasphemous, Salt and Sanctuary

- query: roguelike where the map changes every run
  lang: en
  from: "failures.md #7 - jargon read literally"
  expect: [1145360, 588650, 646570]   # Hades, Dead Cells, Slay the Spire

- query: relaxing puzzle game, nothing scary
  lang: en
  from: "failures.md #1 - negation in free text"
  expect: [736260, 210970, 1049410]   # Baba Is You, The Witness, Superliminal

