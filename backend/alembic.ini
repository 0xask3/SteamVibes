[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Deliberately empty. env.py overrides this with settings.database_url from the
# repo-root .env, so credentials never live in a tracked file and the app and
# the migrations cannot disagree about which database they mean.
sqlalchemy.url =


[post_write_hooks]

# Consumed by env.py's fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
