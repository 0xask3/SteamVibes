[project]
name = "steam-vibe-backend"
version = "0.1.0"
description = "Semantic search over ~120k Steam games"
requires-python = ">=3.14"

# Load the data, embed it, search it from a terminal or over HTTP.
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tqdm>=4.67",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Used directly by eval/run_eval.py, so declared rather than relied on as a
    # transitive dependency of uvicorn[standard].
    "pyyaml>=6.0",
    "sentence-transformers>=6.0.1",
    "torch>=2.9.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "types-tqdm>=4.67",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 88

# torch must come from PyTorch's own index, not PyPI. The PyPI wheel for
# Windows is CPU-ONLY and installs without complaint - `torch.cuda.is_available()`
# just returns False, which looks like a broken GPU rather than a wrong wheel.
# `explicit = true` means only the packages named in [tool.uv.sources] use this
# index, so everything else still resolves from PyPI.
#
# cu130 matches the host driver (CUDA UMD 13.4). The version ceiling is real:
# this index carries torch 2.9.1 for cp314, while PyPI is already on 2.14 - so
# an unpinned `torch>=2.14` silently falls back to PyPI and the CPU build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.ruff.lint.per-file-ignores]
# UP037 wants the quotes removed from Mapped[list["GameTag"]]. Don't: string
# forward references are SQLAlchemy's documented idiom for models defined later
# in the file, and they resolve at mapper-configuration time rather than at
# class creation. Removing them trades a working pattern for a lint score.
"app/models.py" = ["UP037"]

[tool.mypy]
python_version = "3.14"
# CLAUDE.md requires a type hint on every function signature. This enforces it.
disallow_untyped_defs = true
