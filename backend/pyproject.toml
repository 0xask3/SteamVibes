[project]
name = "steam-vibe-backend"
version = "0.1.0"
description = "Semantic search over ~120k Steam games"
requires-python = ">=3.14"

# Load the data, embed it, search it from a terminal or over HTTP.
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tqdm>=4.67",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Used directly by eval/run_eval.py, so declared rather than relied on as a
    # transitive dependency of uvicorn[standard].
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "types-tqdm>=4.67",
    "types-PyYAML>=6.0",
]
# The cross-encoder, and a group rather than a main dependency for the sake of
# the CONTAINER. On Linux these two pull ~2.9GB of wheels - torch, triton and a
# dozen nvidia-* CUDA libraries - and the backend image can use none of it:
# docker-compose pins RANK_METHOD=rrf because the GPU is unreachable from a
# container under Docker Desktop's WSL2 backend (NOTES.md 2026-09-07). While
# these sat in `dependencies`, `uv sync --no-dev` installed them anyway, so
# `docker compose up` spent most of its first build downloading them, and five
# comments across the repo claimed "torch is not in the image" when it was.
#
# In default-groups below, so NOTHING changes on the host: `uv run` and
# `uv sync` still install them and run_eval still reranks out of the box. Only
# the Dockerfile opts out, with --no-default-groups. app/rerank.py imports
# sentence_transformers lazily inside _load(), so a process without it degrades
# to the SQL ordering with a WARNING rather than failing at import.
rerank = [
    "sentence-transformers>=6.0.1",
    "torch>=2.9.1",
]

[tool.uv]
default-groups = ["dev", "rerank"]

[tool.ruff]
line-length = 88

# torch must come from PyTorch's own index, not PyPI. The PyPI wheel for
# Windows is CPU-ONLY and installs without complaint - `torch.cuda.is_available()`
# just returns False, which looks like a broken GPU rather than a wrong wheel.
# `explicit = true` means only the packages named in [tool.uv.sources] use this
# index, so everything else still resolves from PyPI.
#
# cu130 matches the host driver (CUDA UMD 13.4). The index has since caught up
# to PyPI - uv.lock now pins torch 2.14.0+cu130 for cp314, where this comment
# once recorded a 2.9.1 ceiling - but the binding is what keeps it honest: drop
# `[tool.uv.sources]` and resolution goes back to PyPI's CPU-only build.
#
# It also publishes NO macOS wheels, only manylinux and win_amd64, so `uv sync`
# cannot resolve on a Mac. That is the whole platform constraint in README's
# quickstart, and it comes from this block.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.ruff.lint.per-file-ignores]
# UP037 wants the quotes removed from Mapped[list["GameTag"]]. Don't: string
# forward references are SQLAlchemy's documented idiom for models defined later
# in the file, and they resolve at mapper-configuration time rather than at
# class creation. Removing them trades a working pattern for a lint score.
"app/models.py" = ["UP037"]

[tool.mypy]
python_version = "3.14"
# CLAUDE.md requires a type hint on every function signature. This enforces it.
disallow_untyped_defs = true
