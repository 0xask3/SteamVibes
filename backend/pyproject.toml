[project]
name = "steam-vibe-backend"
version = "0.1.0"
description = "Semantic search over ~120k Steam games"
requires-python = ">=3.14"

# Load the data, embed it, search it from a terminal or over HTTP.
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tqdm>=4.67",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Used directly by eval/run_eval.py, so declared rather than relied on as a
    # transitive dependency of uvicorn[standard].
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "types-tqdm>=4.67",
    "types-PyYAML>=6.0",
]
# A group rather than a main dependency for the CONTAINER's sake: these pull
# 3.0GB of torch and CUDA wheels the backend image can use none of, because the
# GPU is unreachable from it (NOTES.md 2026-09-07). Listed in default-groups
# below, so nothing changes on the host - only the Dockerfile opts out, with
# --no-default-groups. app/rerank.py imports it lazily, so a process without it
# degrades to the SQL ordering.
rerank = [
    "sentence-transformers>=6.0.1",
    "torch>=2.9.1",
]

[tool.uv]
default-groups = ["dev", "rerank"]

[tool.ruff]
line-length = 88

# torch must come from PyTorch's own index, not PyPI: the PyPI wheel for
# Windows is CPU-ONLY and installs without complaint, and the only symptom is
# torch.cuda.is_available() == False, which looks like a broken GPU rather than
# a wrong wheel. `explicit = true` keeps everything else on PyPI. Drop
# [tool.uv.sources] and resolution silently goes back to the CPU-only build.
#
# This index publishes no macOS wheels, which is the platform constraint in
# README's quickstart.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.ruff.lint.per-file-ignores]
# UP037 wants the quotes gone from Mapped[list["GameTag"]]. Don't: string
# forward references are SQLAlchemy's documented idiom for models defined later
# in the file, and they resolve at mapper-configuration time.
"app/models.py" = ["UP037"]

[tool.mypy]
python_version = "3.14"
# CLAUDE.md requires a type hint on every function signature. This enforces it.
disallow_untyped_defs = true
